<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل العقار</title>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, sans-serif;
}

body{
    background:#f5f5f5;
    padding:30px;
}

.property-details{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.gallery{
    background:#fff;
    padding:15px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

#mainImage{
    width:100%;
    height:500px;
    object-fit:cover;
    border-radius:10px;
}

.thumbnails{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-top:15px;
}

.thumbnails img{
    width:100%;
    height:80px;
    object-fit:cover;
    cursor:pointer;
    border-radius:10px;
    transition:.3s;
}

.thumbnails img:hover{
    transform:scale(1.05);
    border:3px solid #D4AF37;
}

.property-info{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.property-info h1{
    color:#0A2540;
    margin-bottom:20px;
}

.price{
    font-size:35px;
    font-weight:bold;
    color:#D4AF37;
    margin-bottom:20px;
}

.property-info p{
    margin-bottom:15px;
    font-size:18px;
    color:#444;
}

.property-info h3{
    margin:20px 0 10px;
    color:#0A2540;
}

.contact-btn{
    display:block;
    text-align:center;
    text-decoration:none;

    background:#0A2540;
    color:white;

    padding:15px;
    border-radius:10px;

    margin-top:20px;

    font-weight:bold;

    transition:.3s;
}

.contact-btn:hover{
    background:#D4AF37;
    color:black;
}

@media(max-width:768px){

    .property-details{
        grid-template-columns:1fr;
    }

    #mainImage{
        height:300px;
    }

    .thumbnails{
        grid-template-columns:repeat(3,1fr);
    }

}
</style>
    property-details.css
</head>

<body>

    <section class="property-details">

        <div class="gallery">

            <img id="mainImage"
                 src="Designer (1).png"
                 alt="صورة العقار">

                            

                <img src="Designer (1).png"changeImage(this.src)">        

                    <div class="price">
                3,500,000 جنيه
            </div>

            <p>📍 مدينة نصر</p>

            <p>📐 المساحة: 180 متر</p>

            <p>🛏 عدد الغرف: 3</p>

            <p>🚿 عدد الحمامات: 2</p>

            <p>🏢 الدور الخامس</p>

            <h3>وصف العقار</h3>

            <p>
                شقة سوبر لوكس كاملة التشطيب بالقرب من المدارس
                والمولات والخدمات والمواصلات الرئيسية.
            </p>
<a href="https://wa.me/201003676402?text=مرحباً، أريد الاستفسار عن هذا العقار"
   target="_blank"
   class="contact-btn">
   📱 تواصل عبر واتساب
</a>


        </div>

    </section>

    property-details.jsscript>

</body>

</html>
